# cspell:ignore modelcontextprotocol

# Changesets only uses scoped git tags in monorepos, which needs this
packages:
  - ./

saveExact: true
autoDedupe: true
saveTypes: true
lockfile:
  # Records `autoDedupe`, so that installs don't resolve the lockfile again
  includeResolutionSettings: true

minimumReleaseAge: 960 # 16 hours in minutes
minimumReleaseAgeExclude: # []
  - '@changesets/format@0.1.3'
  - '@modelcontextprotocol/client@2.4.0'
  - '@modelcontextprotocol/core@2.4.0'
  - '@modelcontextprotocol/server@2.4.0'
  - baseline-browser-mapping@2.11.32
  - crossws@0.4.16
  - electron-to-chromium@1.5.464
  - tsdown@0.23.2
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200 # 30 days in minutes
trustPolicyExclude: # []
  # Published by hand after its release workflow failed. Same code as v2.2.1
  - lefthook@2.2.2

audit:
  ignore: []
  ignorePrune: true

allowBuilds:
  lefthook@2.2.2: true

  esbuild: false
  unrs-resolver: false

dedupePeers: true
strictPeerDependencies: false
