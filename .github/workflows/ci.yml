name: Check code
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5.0.0
      - uses: ./.github/actions/prepare

  knip:
    name: Knip
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: ./.github/actions/prepare
      - run: pnpm knip
  spellcheck:
    name: Spellcheck (cspell)
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: ./.github/actions/prepare
      - run: pnpm spellcheck
  formatting:
    name: Formatting check (prettier)
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: ./.github/actions/prepare
      - run: pnpm format:check
  typecheck:
    name: Typecheck (tsgo)
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: ./.github/actions/prepare
      - run: pnpm lint:types:go
  eslint:
    name: ESLint
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: ./.github/actions/prepare
      - run: pnpm lint:eslint
  test:
    name: Test (Node ${{ matrix.node-version }})
    needs: install
    strategy:
      matrix:
        node-version: [22, 24, 25]
    uses: ./.github/workflows/ci-matrix-tests.yml
    with:
      node-version: ${{ matrix.node-version }}
  build:
    name: Build
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: ./.github/actions/prepare
      - run: pnpm build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
  lint-attw:
    name: Lint artifacts (attw)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: ./.github/actions/prepare
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/
      - run: |
          # `attw --pack` internally calls `npm pack`, which may fail due to broken internal deps
          # in the runner's bundled npm. Pack via pnpm instead and pass the tarball directly to attw.
          pnpm pack --pack-destination /tmp
          pnpm exec attw /tmp/ms-ts-*.tgz --profile esm-only
  lint-publint:
    name: Lint artifacts (publint)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: ./.github/actions/prepare
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/
      - run: pnpm lint:publint
